[project]
name = "jp-opendata-db"
version = "0.1.0"
description = "Integrated Japanese public open-data database (Corporate Number x Permits x MLIT GIS x EDINET)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "duckdb>=1.1.0",
    "httpx>=0.27.0",
    "openpyxl>=3.1.5",
    "polars>=1.10.0",
    "pypdfium2>=4.30.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/jp_opendata"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
